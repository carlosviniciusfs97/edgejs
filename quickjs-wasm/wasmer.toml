[package]
name = "wasmer/edgejs-quickjs"
version = "0.1.3"
description = "Edge.js with an embedded QuickJS N-API provider"
entrypoint = "edge"

[[module]]
name = "edge"
source = "../build-quickjs-wasix/edgejs.wasm"
abi = "wasi"

[[command]]
name = "edge"
module = "edge"

[[command]]
name = "node"
module = "edge"

[[command]]
name = "pnpm"
module = "edge"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/pnpm/edge-pnpm.cjs"]
env = [
  "HOME=/tmp",
  "npm_config_network_concurrency=4",
  "npm_config_node_linker=hoisted",
  "npm_config_package_import_method=copy",
  "npm_config_store_dir=/tmp/.pnpm-store",
  "npm_config_update_notifier=false",
]

[[command]]
name = "npm"
module = "edge"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/pnpm/edge-pnpm.cjs"]
env = [
  "HOME=/tmp",
  "npm_config_network_concurrency=4",
  "npm_config_node_linker=hoisted",
  "npm_config_package_import_method=copy",
  "npm_config_store_dir=/tmp/.pnpm-store",
  "npm_config_update_notifier=false",
]

[fs]
"/etc" = "./etc"
"/pnpm" = "./pnpm"
"/usr/local/ssl" = "../ssl-certs"

[dependencies]
"wasmer/bash" = "1.0.25"
